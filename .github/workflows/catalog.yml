name: 更新总目录

on:
  schedule:
    - cron: "0 1 * * 1"   # 每周一 09:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 重新生成 skills.json 与 about-author.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_catalog.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 有变化就提交
        run: |
          if git diff --quiet; then echo "无变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills.json about-author.md
          git commit -m "chore: 每周自动更新总目录与作者页"
          git push
